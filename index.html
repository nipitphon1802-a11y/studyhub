<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyHub 📚</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;700&family=Mali:wght@400;600;700&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#6d3fd9;--p2:#4b5fe0;--bg:#f4f4f8;--card:#fff;--chip:#f0effa;--tx:#23213a;--mut:#6b6a80;--line:#e3e2ee;--r:18px;--font:'Prompt','Noto Sans Thai',Tahoma,sans-serif}
:root[data-dark]{--bg:#14132a;--card:#1f1e3a;--chip:#2b2a4d;--tx:#ecebff;--mut:#a3a2c4;--line:#37365c}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--tx);transition:background .3s}
header{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 16px rgba(75,42,168,.25)}
.hb{display:flex;gap:8px}
.bar{position:relative}
.menu{position:absolute;right:20px;top:calc(100% + 6px);width:min(230px,calc(100vw - 24px));background:var(--card);color:var(--tx);border-radius:var(--r);box-shadow:0 14px 36px rgba(30,20,80,.3);padding:6px 8px;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.2s}
.menu.open{opacity:1;pointer-events:auto;transform:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;border-radius:calc(var(--r)*.6);font:inherit;color:var(--tx);cursor:pointer;text-align:left}.mi:hover{background:var(--chip)}
.av{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;overflow:hidden;font-size:.95rem;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.pfp{width:130px;height:130px;border-radius:50%;margin:0 auto 14px;background:var(--chip);display:grid;place-items:center;font-size:3.5rem;overflow:hidden;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--p)}.pfp img{width:100%;height:100%;object-fit:cover}
.lb{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:calc(var(--r)*.6)}.lb.me{background:var(--chip)}.md1{width:34px;text-align:center;font-size:1.3rem;flex:none}
.lb .bar{height:6px;background:var(--line);border-radius:6px;margin-top:4px}.lb .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p),var(--p2))}
.cdp{display:none;position:relative;margin:14px auto 0!important;background:rgba(255,255,255,.2);border-radius:999px;padding:7px 18px;width:fit-content;max-width:100%;font-size:.92rem;cursor:pointer}
.tg{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border-radius:calc(var(--r)*.7);padding:10px 14px;text-align:center;font-weight:500;font-size:.92rem}
.pnav{display:flex;align-items:center;gap:8px;margin:12px 0}.pnav b{flex:1;text-align:center}.pnav .btn{padding:6px 12px}
.pcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{text-align:center;font-size:.75rem;color:var(--mut);padding:4px 0}
.cdy{position:relative;aspect-ratio:1;border:1.5px solid transparent;background:var(--chip);border-radius:calc(var(--r)*.5);font:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;transition:.15s}
.cdy:hover{border-color:var(--p2)}.cdy.today{border-color:var(--p)}.cdy.sel{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff}
.cdy i{font-style:normal;font-size:.8rem;line-height:1;min-height:.8rem}
.cdy u{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--p2)}.cdy.sel u{background:#fff}
.cdy em{position:absolute;left:3px;top:1px;font-size:.6rem;font-style:normal}
.ped{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.marks{display:flex;gap:6px;flex-wrap:wrap}.mk{font-size:1.2rem;padding:4px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}.mk.on{border-color:var(--p);background:var(--chip)}
.mrow{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}.mrow:last-child{border:0}
.mrow span{font-size:.8rem;color:var(--mut)}.mrow input{padding:7px 10px}
.mrow ol{margin:2px 0 0;padding-left:20px;font-size:.88rem;line-height:1.7}.mrow li{overflow:hidden;text-overflow:ellipsis}.mrow li small{color:var(--mut)}
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:280px;height:280px;left:-70px;top:-100px}.hero::after{width:210px;height:210px;right:-40px;bottom:-90px}
.hero h1,.hero p{position:relative}
body[data-bg=dots]{background-image:radial-gradient(var(--line) 1.4px,transparent 1.4px);background-size:22px 22px}
body[data-bg=grid]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;transition:.2s}.sw:hover{transform:scale(1.12)}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=color]{padding:3px;height:42px;cursor:pointer}input[type=range]{padding:0;border:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx)!important;cursor:pointer}.chk input{width:auto}
.bar{max-width:1200px;flex-wrap:wrap;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:1.5rem;font-weight:700}
.btn{border:0;border-radius:calc(var(--r)*.7);padding:10px 18px;font:inherit;font-weight:500;cursor:pointer;transition:.2s}
.btn-w{background:#fff;color:var(--p)}.btn-w:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.2)}
.btn-p{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff}.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(109,63,217,.4)}
.btn-g{background:var(--chip);color:var(--tx)}.btn-g:hover{filter:brightness(.94)}
.btn-d{background:#fdeaea;color:#c0392b}.btn-d:hover{background:#f9d3d3}
.hero{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;text-align:center;padding:36px 20px 64px}
.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}.hero p{margin:0;opacity:.9}
main{position:relative;z-index:1;max-width:1200px;margin:-38px auto 40px;padding:0 20px}
.panel{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 8px 28px rgba(50,40,110,.1);margin-bottom:18px}
.srow{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:calc(var(--r)*.7);padding:10px 14px;background:var(--card);color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:transparent}
.srow input{flex:1;min-width:200px}.srow select{width:auto}
.lbl{font-size:.85rem;color:var(--mut);margin:0 0 8px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips+.lbl{margin-top:14px}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--chip);border:1.5px solid transparent;color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:.92rem;transition:.2s;white-space:nowrap}
.chip:hover{border-color:var(--p2)}
.chip.on{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff}
.chip small{display:block;font-size:.72rem;opacity:.75;line-height:1.1}
.chip .x{background:rgba(0,0,0,.12);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:.85rem;line-height:1}
.chip .x:hover{background:#e74c3c;color:#fff}
.chip.add{background:var(--card);border:1.5px dashed var(--p);color:var(--p)}
.chip.trash.on{background:#5b5b70}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px rgba(50,40,110,.09);display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(50,40,110,.2)}
.th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 18%,var(--card)),color-mix(in srgb,var(--p2) 18%,var(--card)));display:grid;place-items:center;font-size:3rem;cursor:pointer}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:1.3rem}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;background:color-mix(in srgb,var(--p) 14%,var(--card));color:var(--p);border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:500}
.cb h3{margin:4px 0 0;font-size:1.05rem;line-height:1.4}
.ch{color:var(--mut);font-size:.88rem}
.ds{color:var(--mut);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.acts{display:flex;gap:8px;margin-top:8px}.acts .btn{flex:1;padding:9px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}.empty .big{font-size:3.5rem}.empty h2{margin:8px 0 4px;color:var(--tx)}
.tcard{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 14px rgba(50,40,110,.09);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.tcard b{font-size:1.05rem}.tcard div p{margin:3px 0;color:var(--mut);font-size:.9rem}
.ov{position:fixed;inset:0;background:rgba(25,20,60,.55);display:grid;place-items:center;padding:16px;z-index:50;opacity:0;pointer-events:none;transition:.25s}
.ov.open{opacity:1;pointer-events:auto}
.md{background:var(--card);color:var(--tx);border-radius:var(--r);padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;transform:translateY(20px) scale(.97);transition:.25s}
.ov.open .md{transform:none}
.md h2{margin:0 0 14px}.md label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 5px;font-weight:500}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.err{color:#c0392b;font-size:.85rem;margin-top:8px;min-height:1em}
@media(max-width:600px){.menu{right:12px}.hb .btn{padding:8px 12px;font-size:.85rem}.bar{padding:12px 14px}.logo{font-size:1.25rem}main{padding:0 12px}.grid{grid-template-columns:1fr}.srow select{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo" id="logo">StudyHub 📚</div><div class="hb"><button class="btn btn-w" id="themeBtn">🎨 ตกแต่ง</button><button class="btn btn-w" id="addClipBtn">＋ เพิ่มคลิป</button><button class="btn btn-w" id="menuBtn" aria-label="เมนู" title="เมนู">☰</button></div>
<div class="menu" id="menu">
  <button class="mi" data-info="creator"><span class="av" id="miAv">💡</span>ผู้สร้าง</button>
  <button class="mi" data-info="ai"><span class="av">🤖</span>AI ที่ช่วย</button>
  <button class="mi" data-info="hours"><span class="av">⏱️</span>ชั่วโมงการดู</button>
  <button class="mi" data-info="rank"><span class="av">🏆</span>จัดอันดับการดู</button>
  <button class="mi" data-info="plan"><span class="av">📅</span>แพลนการอ่าน</button>
</div></div></header>
<section class="hero"><h1 id="heroT">คลังคลิปการเรียนของเรา</h1><p id="heroS">รวมบทเรียนทุกวิชาไว้ในที่เดียว ค้นหาและเปิดเรียนได้ง่าย</p><p id="heroCd" class="cdp" title="เปิดแพลนการอ่าน"></p></section>
<main>
<div class="panel">
  <div class="srow">
    <input id="q" type="search" placeholder="🔎 ค้นหาชื่อคลิป หรือเนื้อหา...">
    <select id="sort"><option value="new">เพิ่มล่าสุด</option><option value="az">ชื่อ A-Z</option></select>
  </div>
  <p class="lbl" style="margin-top:16px">วิชา</p>
  <div class="chips" id="subjects"></div>
  <p class="lbl">ช่อง YouTube</p>
  <div class="chips" id="channels"></div>
</div>
<div id="content"></div>
</main>

<div class="ov" id="clipOv"><div class="md" role="dialog" aria-modal="true">
  <h2>เพิ่มคลิปการสอน 🎬</h2>
  <label for="fTitle">ชื่อคลิป</label><input id="fTitle" placeholder="เช่น สมการกำลังสอง ตอนที่ 1">
  <label for="fChan">ชื่อช่อง YouTube</label><input id="fChan" placeholder="เช่น Math by Kru A" list="chanList"><datalist id="chanList"></datalist>
  <label for="fSub">วิชา</label><select id="fSub"></select>
  <label for="fDesc">คำอธิบาย</label><textarea id="fDesc" rows="3" placeholder="เนื้อหาที่สอนโดยย่อ"></textarea>
  <label for="fUrl">ลิงก์ YouTube</label><input id="fUrl" placeholder="https://www.youtube.com/watch?v=...">
  <div class="err" id="clipErr"></div>
  <div class="mact"><button class="btn btn-g" data-close="clipOv">ยกเลิก</button><button class="btn btn-p" id="saveClip">บันทึกคลิป</button></div>
</div></div>

<div class="ov" id="subOv"><div class="md" role="dialog" aria-modal="true">
  <h2>เพิ่มวิชา 📚</h2>
  <label for="fSubName">ชื่อวิชา</label><input id="fSubName" placeholder="เช่น ดาราศาสตร์, ภาษาจีน, ศิลปะ">
  <div class="err" id="subErr"></div>
  <div class="mact"><button class="btn btn-g" data-close="subOv">ยกเลิก</button><button class="btn btn-p" id="saveSub">เพิ่มวิชา</button></div>
</div></div>

<div class="ov" id="themeOv"><div class="md" role="dialog" aria-modal="true">
  <h2>ตกแต่งเว็บของเรา 🎨</h2>
  <label>ธีมสีสำเร็จรูป</label><div class="swrow" id="presets"></div>
  <div class="two"><div><label for="tC1">สีหลัก</label><input type="color" id="tC1"></div><div><label for="tC2">สีรอง</label><input type="color" id="tC2"></div></div>
  <label class="chk"><input type="checkbox" id="tDark"> 🌙 โหมดมืด</label>
  <div class="two"><div><label for="tBg">ลายพื้นหลัง</label><select id="tBg"><option value="plain">เรียบ</option><option value="dots">จุด</option><option value="grid">ตาราง</option></select></div>
  <div><label for="tFont">ฟอนต์</label><select id="tFont"><option>Prompt</option><option>Sarabun</option><option>Mali</option><option>Kanit</option></select></div></div>
  <label for="tR">ความโค้งของมุม</label><input type="range" id="tR" min="6" max="32">
  <label for="tLogo">ชื่อเว็บ (โลโก้)</label><input id="tLogo">
  <label for="tHt">หัวข้อหน้าแรก</label><input id="tHt">
  <label for="tHs">คำอธิบายหน้าแรก</label><input id="tHs">
  <div class="mact"><button class="btn btn-g" id="tReset">รีเซ็ตเป็นค่าเริ่มต้น</button><button class="btn btn-p" data-close="themeOv">เสร็จสิ้น</button></div>
</div></div>

<div class="ov" id="infoOv"><div class="md" role="dialog" aria-modal="true"><h2 id="infoT"></h2><div id="infoB"></div><div class="mact"><button class="btn btn-p" data-close="infoOv">ปิด</button></div></div></div>

<div class="ov" id="planOv"><div class="md" style="max-width:520px" role="dialog" aria-modal="true">
  <h2>แพลนการอ่าน 📅</h2>
  <div class="tg" id="planTargetBox" style="display:none"></div>
  <div class="pnav"><button class="btn btn-g" id="pPrev" aria-label="เดือนก่อน">‹</button><b id="planMonth"></b><button class="btn btn-g" id="pNext" aria-label="เดือนถัดไป">›</button><button class="btn btn-g" id="pToday">วันนี้</button></div>
  <div class="pcal" id="planCal"></div>
  <div class="ped">
    <div><b id="pDate"></b> <small id="pCd" style="color:var(--mut)"></small></div>
    <div class="marks" id="pMarks"></div>
    <textarea id="pNote" rows="3" placeholder="เขียนแพลน เช่น อ่านบทที่ 3 ฟิสิกส์ / ทำโจทย์ 20 ข้อ"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn btn-g" id="pTgt"></button><input type="time" id="pTime" step="1" style="width:auto"></div>
    <button class="btn btn-d" id="pClear" style="align-self:flex-start;padding:6px 12px">ล้างวันนี้</button>
  </div>
  <div class="mact"><button class="btn btn-p" data-close="planOv">ปิด</button></div>
</div></div>

<div class="ov" id="cfOv"><div class="md" role="alertdialog" aria-modal="true">
  <h2>ยืนยัน</h2><p id="cfMsg" style="white-space:pre-line;margin:0"></p>
  <div class="mact"><button class="btn btn-g" id="cfNo">ยกเลิก</button><button class="btn btn-d" id="cfOk">ยืนยัน</button></div>
</div></div>

const DEFAULT_SUBJECTS=['คณิตศาสตร์','วิทยาศาสตร์','ฟิสิกส์','เคมี','ชีววิทยา','ภาษาอังกฤษ','ภาษาไทย','สังคมศึกษา','คอมพิวเตอร์'];
const K={v:'study_videos',s:'study_subjects',c:'study_channel_subjects',t:'study_trash'};
const load=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};
const save=()=>{try{localStorage.setItem(K.v,JSON.stringify(videos));localStorage.setItem(K.s,JSON.stringify(customSubjects));localStorage.setItem(K.c,JSON.stringify(chanSub));localStorage.setItem(K.t,JSON.stringify(trash))}catch(e){}};
let videos = load(K.v, null),
    customSubjects = load(K.s, []),
    chanSub = load(K.c, null),
    trash = load(K.t, []);

const START_CLIP = {
    title: 'ตัวอย่างคลิป — ลบรายการนี้แล้วใส่คลิปของเรา',
    channel: 'Rick Astley 😎',
    subject: 'คณิตศาสตร์',
    desc: 'กดปุ่ม "เพิ่มคลิป" เพื่อใส่คลิปจริงของเรา',
    url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
};

if (!videos) {
    videos = [{
        id: 'v' + Date.now(),
        ...START_CLIP,
        added: Date.now()
    }];

    chanSub = {
        [START_CLIP.channel]: START_CLIP.subject
    };

    save();
}

chanSub = chanSub || {};

// แก้ข้อมูล Rickroll เก่าที่อาจค้างอยู่ใน localStorage
videos.forEach(v => {
    if (v.url && v.url.includes('dQw4w9WgXcQ')) {
        v.title = START_CLIP.title;
        v.channel = START_CLIP.channel;
        v.subject = START_CLIP.subject;
        v.desc = START_CLIP.desc;
        v.url = START_CLIP.url;

        chanSub[START_CLIP.channel] = START_CLIP.subject;
    }
});

save();
let curSub='ทั้งหมด',curChan=null,showTrash=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allSubjects=()=>[...DEFAULT_SUBJECTS,...customSubjects];
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/);return m?m[1]:null};

function renderSubjects(){
  const subs=allSubjects();
  $('subjects').innerHTML=['ทั้งหมด',...subs].map(s=>{
    const custom=customSubjects.includes(s);
    return `<button class="chip ${!showTrash&&curSub===s?'on':''}" data-sub="${esc(s)}">${esc(s)}${custom?`<span class="x" data-delsub="${esc(s)}" title="ลบวิชา">×</span>`:''}</button>`;
  }).join('')+`<button class="chip add" id="addSubBtn">＋ เพิ่มวิชา</button>`;
}
function renderChannels(){
  const names=Object.keys(chanSub).filter(c=>curSub==='ทั้งหมด'||chanSub[c]===curSub);
  $('channels').innerHTML=`<button class="chip ${!showTrash&&!curChan?'on':''}" data-chan="">📺 ทุกช่อง</button>`+
    names.map(c=>`<button class="chip ${!showTrash&&curChan===c?'on':''}" data-chan="${esc(c)}"><span>📺 ${esc(c)}<small>${esc(chanSub[c])}</small></span><span class="x" data-delchan="${esc(c)}" title="ย้ายไปถังขยะ">×</span></button>`).join('')+
    `<button class="chip trash ${showTrash?'on':''}" id="trashBtn">🗑️ ถังขยะ (${trash.length})</button>`;
}
function thumb(v){
  const id=ytId(v.url);
  return `<div class="th" data-open="${esc(v.id)}">${id?`<img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" data-id="${id}" referrerpolicy="no-referrer" alt="" onerror="thumbErr(this)" onload="thumbOk(this)">`:'🎬'}<div class="play">▶</div></div>`;
}
// โหลดรูปปก 16:9 แบบเล็กก่อน (มีทุกคลิป) แล้วค่อยอัปเกรดเป็นความละเอียดสูงถ้ามี
function thumbOk(img){
  if(img.dataset.up)return;img.dataset.up=1;
  const h=new Image();h.referrerPolicy='no-referrer';
  h.onload=()=>{if(h.naturalWidth>=600)img.src=h.src};
  h.src=`https://img.youtube.com/vi/${img.dataset.id}/maxresdefault.jpg`;
}
function thumbErr(img){const p=img.parentNode;img.remove();if(p)p.insertAdjacentText('afterbegin','🎬')}
function fixThumbs(){}
function renderContent(){
  const box=$('content');
  if(showTrash){
    box.innerHTML=trash.length?trash.map((t,i)=>(t.type==='video'
      ?`<div class="tcard"><div><b>🎬 ${esc(t.video.title)}</b><p>ช่อง: ${esc(t.video.channel)}</p><p>วิชา: ${esc(t.video.subject)}</p></div>`
      :`<div class="tcard"><div><b>📺 ${esc(t.channel)}</b><p>วิชา: ${esc(t.subject)}</p><p>จำนวนคลิป: ${t.videos.length}</p></div>`)+`<div class="acts"><button class="btn btn-p" data-restore="${i}">↩️ กู้คืน</button><button class="btn btn-d" data-purge="${i}">❌ ลบถาวร</button></div></div>`).join(''):
      `<div class="empty"><div class="big">🗑️</div><h2>ถังขยะว่างเปล่า</h2><p>ช่องที่ลบจะมาอยู่ที่นี่ และกู้คืนได้</p></div>`;
    return;
  }
  const q=$('q').value.trim().toLowerCase();
  let list=videos.filter(v=>(curSub==='ทั้งหมด'||v.subject===curSub)&&(!curChan||v.channel===curChan)&&
    (!q||[v.title,v.desc,v.subject,v.channel].some(x=>String(x).toLowerCase().includes(q))));
  list.sort($('sort').value==='az'?(a,b)=>a.title.localeCompare(b.title,'th'):(a,b)=>b.added-a.added);
  box.innerHTML=list.length?`<div class="grid">`+list.map(v=>`<article class="card">${thumb(v)}<div class="cb"><span class="tag">🏷️ ${esc(v.subject)}</span><h3>${esc(v.title)}</h3><div class="ch">📺 ${esc(v.channel)}</div><div class="ds">${esc(v.desc)}</div><div class="acts"><button class="btn btn-p" data-open="${esc(v.id)}">▶ เรียน</button><button class="btn btn-d" data-delvid="${esc(v.id)}">ลบ</button></div></div></article>`).join('')+`</div>`:
    `<div class="empty"><div class="big">📚</div><h2>ยังไม่พบคลิป</h2><p>ลองเปลี่ยนคำค้นหา หรือเพิ่มคลิปใหม่</p></div>`;
  fixThumbs();
}
function render(){renderSubjects();renderChannels();renderContent()}

// กล่องยืนยันของเราเอง (confirm() ของเบราว์เซอร์อาจถูกบล็อกในหน้าพรีวิว)
function ask(msg){return new Promise(res=>{
  $('cfMsg').textContent=msg;openModal('cfOv');
  const done=v=>{closeModal('cfOv');res(v)};
  $('cfOk').onclick=()=>done(true);$('cfNo').onclick=()=>done(false);
})}
function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
function openClip(){
  $('fSub').innerHTML=allSubjects().map(s=>`<option ${s===curSub?'selected':''}>${esc(s)}</option>`).join('');
  $('chanList').innerHTML=Object.keys(chanSub).map(c=>`<option value="${esc(c)}">`).join('');
  ['fTitle','fChan','fDesc','fUrl'].forEach(i=>$(i).value='');
  if(curChan)$('fChan').value=curChan;
  $('clipErr').textContent='';openModal('clipOv');$('fTitle').focus();
}
function pruneChannels(){Object.keys(chanSub).forEach(c=>{if(!videos.some(v=>v.channel===c))delete chanSub[c]})}

$('addClipBtn').onclick=openClip;
$('saveClip').onclick=()=>{
  const title=$('fTitle').value.trim(),channel=$('fChan').value.trim(),subject=$('fSub').value,desc=$('fDesc').value.trim(),url=$('fUrl').value.trim();
  if(!title||!channel||!url){$('clipErr').textContent='กรุณากรอกชื่อคลิป ชื่อช่อง และลิงก์ YouTube';return}
  if(!/^https?:\/\//i.test(url)){$('clipErr').textContent='ลิงก์ต้องขึ้นต้นด้วย https://';return}
  videos.push({id:'v'+Date.now()+Math.random().toString(36).slice(2,6),title,channel,subject,desc,url,added:Date.now()});
  if(!chanSub[channel])chanSub[channel]=subject;
  save();closeModal('clipOv');showTrash=false;render();
};
$('saveSub').onclick=()=>{
  const n=$('fSubName').value.trim();
  if(!n){$('subErr').textContent='กรุณาพิมพ์ชื่อวิชา';return}
  if(allSubjects().some(s=>s.toLowerCase()===n.toLowerCase())||n==='ทั้งหมด'){$('subErr').textContent='มีวิชานี้อยู่แล้ว';return}
  customSubjects.push(n);save();closeModal('subOv');curSub=n;curChan=null;showTrash=false;render();
};
$('fSubName').addEventListener('keydown',e=>{if(e.key==='Enter')$('saveSub').click()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)closeModal(o.id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ov.open').forEach(o=>closeModal(o.id))});
$('q').oninput=renderContent;$('sort').onchange=renderContent;

document.addEventListener('click',async e=>{
  const t=e.target,d=n=>t.closest('['+n+']');
  let el;
  if(el=d('data-delsub')){e.stopPropagation();
    const name=el.dataset.delsub,n=videos.filter(v=>v.subject===name).length;
    let msg=`ต้องการลบวิชา ${name} ใช่ไหม?`;
    if(n)msg+=`\n\nวิชานี้มีคลิปอยู่ ${n} คลิป\nคลิปเหล่านี้จะถูกลบด้วย`;
    if(await ask(msg)){
      videos=videos.filter(v=>v.subject!==name);customSubjects=customSubjects.filter(s=>s!==name);
      Object.keys(chanSub).forEach(c=>{if(chanSub[c]===name&&!videos.some(v=>v.channel===c))delete chanSub[c]});
      if(curSub===name)curSub='ทั้งหมด';if(curChan&&!chanSub[curChan])curChan=null;
      save();render();
    }return}
  if(el=d('data-delchan')){e.stopPropagation();
    const c=el.dataset.delchan,vs=videos.filter(v=>v.channel===c);
    if(await ask(`ต้องการลบช่อง ${c} ใช่ไหม?\nช่องและคลิป ${vs.length} คลิปจะถูกย้ายไปถังขยะ (กู้คืนได้)`)){
      trash.push({channel:c,subject:chanSub[c],videos:vs});
      videos=videos.filter(v=>v.channel!==c);delete chanSub[c];
      if(curChan===c)curChan=null;save();render();
    }return}
  if(el=d('data-sub')){curSub=el.dataset.sub;curChan=null;showTrash=false;render();return}
  if(el=d('data-chan')){curChan=el.dataset.chan||null;showTrash=false;render();return}
  if(t.closest('#trashBtn')){showTrash=true;render();return}
  if(t.closest('#addSubBtn')){$('fSubName').value='';$('subErr').textContent='';openModal('subOv');$('fSubName').focus();return}
  if(el=d('data-open')){const v=videos.find(x=>x.id===el.dataset.open);if(v)watchClip(v);return}
  if(el=d('data-delvid')){
    const v=videos.find(x=>x.id===el.dataset.delvid);if(!v)return;
    if(await ask(`ต้องการลบคลิปนี้ใช่ไหม?\n${v.title}\n\nคลิปจะถูกย้ายไปถังขยะ (กู้คืนได้)`)){
      trash.push({type:'video',video:v});videos=videos.filter(x=>x.id!==v.id);
      pruneChannels();if(curChan&&!chanSub[curChan])curChan=null;save();render()}return}
  if(el=d('data-restore')){
    const i=+el.dataset.restore,it=trash[i];if(!it)return;
    const list=it.type==='video'?[it.video]:it.videos,subj=it.type==='video'?it.video.subject:it.subject;
    list.forEach(v=>{
      if(!allSubjects().includes(v.subject))customSubjects.push(v.subject);
      if(chanSub[v.channel]===undefined)chanSub[v.channel]=(it.type==='video'?v.subject:subj);
    });
    videos.push(...list);trash.splice(i,1);save();render();return}
  if(el=d('data-purge')){
    const i=+el.dataset.purge,it=trash[i];if(!it)return;
    const msg=it.type==='video'?`ลบคลิป ${it.video.title} อย่างถาวรใช่ไหม?\nไม่สามารถกู้คืนได้`:`ลบช่อง ${it.channel} และคลิป ${it.videos.length} คลิปอย่างถาวรใช่ไหม?\nไม่สามารถกู้คืนได้`;
    if(await ask(msg)){(it.type==='video'?[it.video]:it.videos).forEach(v=>delete stats[v.id]);saveStats();trash.splice(i,1);save();render()}return}
});

// ---------- ตกแต่งเว็บ (ธีม) ----------
const PRESETS=[['ม่วงน้ำเงิน','#6d3fd9','#4b5fe0'],['ชมพูส้ม','#e0409a','#f0715a'],['เขียวฟ้า','#12a37f','#2e86de'],['ส้มแดง','#f2994a','#eb5757'],['ฟ้าคราม','#0ea5e9','#6366f1'],['ม่วงเข้ม','#3b2a7a','#1e1b4b']];
const DEF_T={c1:'#6d3fd9',c2:'#4b5fe0',dark:false,bg:'plain',font:'Prompt',r:18,logo:'StudyHub 📚',ht:'คลังคลิปการเรียนของเรา',hs:'รวมบทเรียนทุกวิชาไว้ในที่เดียว ค้นหาและเปิดเรียนได้ง่าย'};
let T={...DEF_T,...load('study_theme',{})};
const saveT=()=>{try{localStorage.setItem('study_theme',JSON.stringify(T))}catch(e){}};
function applyTheme(){
  const st=document.documentElement.style;
  st.setProperty('--p',T.c1);st.setProperty('--p2',T.c2);st.setProperty('--r',T.r+'px');
  st.setProperty('--font',`'${T.font}','Noto Sans Thai',Tahoma,sans-serif`);
  document.documentElement.toggleAttribute('data-dark',!!T.dark);document.body.dataset.bg=T.bg;
  $('logo').textContent=T.logo||'StudyHub 📚';$('heroT').textContent=T.ht;$('heroS').textContent=T.hs;
  document.title=T.logo||'StudyHub 📚';
}
function syncForm(){$('tC1').value=T.c1;$('tC2').value=T.c2;$('tDark').checked=!!T.dark;$('tBg').value=T.bg;$('tFont').value=T.font;$('tR').value=T.r;$('tLogo').value=T.logo;$('tHt').value=T.ht;$('tHs').value=T.hs}
function setT(k,v){T[k]=v;saveT();applyTheme()}
$('presets').innerHTML=PRESETS.map((p,i)=>`<button class="sw" data-pre="${i}" title="${p[0]}" style="background:linear-gradient(135deg,${p[1]},${p[2]})"></button>`).join('');
$('presets').onclick=e=>{const b=e.target.closest('[data-pre]');if(!b)return;const p=PRESETS[+b.dataset.pre];T.c1=p[1];T.c2=p[2];saveT();applyTheme();syncForm()};
[['tC1','c1','input'],['tC2','c2','input'],['tBg','bg','change'],['tFont','font','change'],['tLogo','logo','input'],['tHt','ht','input'],['tHs','hs','input']].forEach(([id,k,ev])=>$(id).addEventListener(ev,e=>setT(k,e.target.value)));
$('tDark').onchange=e=>setT('dark',e.target.checked);
$('tR').oninput=e=>setT('r',+e.target.value);
$('tReset').onclick=async()=>{if(await ask('รีเซ็ตการตกแต่งทั้งหมดเป็นค่าเริ่มต้นใช่ไหม?\n(คลิปและวิชาจะไม่หาย)')){T={...DEF_T};saveT();applyTheme();syncForm()}};
$('themeBtn').onclick=()=>{syncForm();openModal('themeOv')};
applyTheme();
render();

// ---------- เมนู ☰ + สถิติการดู ----------
// เก็บเวลาดูโดยประมาณ: นับจากตอนกดเรียน จนกลับมาที่หน้านี้อีกครั้ง
let stats=load('study_stats',{}),pending=null;
const saveStats=()=>{try{localStorage.setItem('study_stats',JSON.stringify(stats))}catch(e){}};
const stat=id=>stats[id]||(stats[id]={n:0,sec:0});
const fmt=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h} ชม. ${m} นาที`:m?`${m} นาที`:`${sec} วินาที`};
function endWatch(){
  if(!pending)return;
  const sec=Math.min((Date.now()-pending.t)/1000,4*3600);
  if(sec>=3){stat(pending.id).sec+=sec}
  pending=null;saveStats();if($('infoOv').classList.contains('open')&&['hours','rank'].includes(curInfo))openInfo(curInfo);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)endWatch()});
window.addEventListener('focus',endWatch);
let curInfo=null;
const totalSec=()=>Object.values(stats).reduce((a,x)=>a+x.sec,0);
const setAv=()=>{$('miAv').innerHTML=`<img src="${DEFAULT_CREATOR_IMG}" alt="">`};
function openInfo(k){
  curInfo=k;const B=$('infoB'),H=$('infoT');
  if(k==='creator'){
    H.textContent='ผู้สร้าง 💡';
    B.innerHTML=`<div class="pfp"><img src="${DEFAULT_CREATOR_IMG}" alt="รูปผู้สร้าง"></div><p style="text-align:center;font-size:1.25rem;font-weight:600;margin:0">${esc(DEFAULT_CREATOR_NAME)}</p>`;
  }else if(k==='ai'){
    H.textContent='AI ที่ช่วย 🤖';B.innerHTML='<p style="font-size:1.15rem;line-height:2.1;margin:0">1. ChatGPT<br>2. Claude</p>';
  }else if(k==='hours'){
    H.textContent='ชั่วโมงการดู ⏱️';
    B.innerHTML=`<div style="text-align:center;font-size:2rem;font-weight:700;color:var(--p)">${fmt(totalSec())}</div><p style="text-align:center;color:var(--mut);font-size:.85rem;margin:8px 0 0">เวลาโดยประมาณ นับจากกด "เรียน" จนกลับมาที่หน้านี้</p>`;
  }else{
    H.textContent='จัดอันดับการดู 🏆';
    const top=videos.filter(v=>stats[v.id]&&stats[v.id].n>0).sort((a,b)=>stats[b.id].n-stats[a.id].n||stats[b.id].sec-stats[a.id].sec).slice(0,10);
    B.innerHTML=top.length?'<ol style="margin:0;padding-left:22px;line-height:1.8">'+top.map(v=>`<li>${esc(v.title)}<br><small style="color:var(--mut)">${stats[v.id].n} ครั้ง · ${fmt(stats[v.id].sec)}</small></li>`).join('')+'</ol>':'<div class="empty" style="padding:20px"><div class="big">🏆</div><p>ยังไม่มีข้อมูล ลองกด "เรียน" ที่คลิปดู</p></div>';
  }
  openModal('infoOv');
}
$('menuBtn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open')};
$('menu').onclick=e=>{const b=e.target.closest('[data-info]');if(!b)return;$('menu').classList.remove('open');b.dataset.info==='plan'?openPlan():openInfo(b.dataset.info)};
setAv();
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('menu').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('menu').classList.remove('open')});


function watchClip(v){stat(v.id).n++;pending={id:v.id,t:Date.now()};saveStats();window.open(v.url,'_blank','noopener')}

// ---------- แพลนการอ่าน (ปฏิทิน) ----------
const MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const WD=['อา','จ','อ','พ','พฤ','ศ','ส'],MARKS=['⭐','📖','📝','🔥','✅'];
let plans=load('study_plans',{}),planTarget=load('study_plan_target',null),pv=new Date(),pSel='';
const keyOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=k=>Math.round((parseKey(k)-parseKey(keyOf(new Date())))/86400000);
const cdText=k=>{const n=dayDiff(k);return n>0?`อีก ${n} วัน`:n===0?'วันนี้! 🎉':`ผ่านมาแล้ว ${-n} วัน`};
const ent=k=>plans[k]||(plans[k]={});
function commit(){
  Object.keys(plans).forEach(k=>{const p=plans[k];if(!p.mark&&!p.note&&k!==planTarget)delete plans[k]});
  try{localStorage.setItem('study_plans',JSON.stringify(plans));localStorage.setItem('study_plan_target',JSON.stringify(planTarget))}catch(e){}
}
function renderPlan(){
  const y=pv.getFullYear(),m=pv.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),today=keyOf(new Date());
  let h=WD.map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){
    const k=keyOf(new Date(y,m,d)),p=plans[k]||{};
    h+=`<button class="cdy ${k===today?'today':''} ${k===pSel?'sel':''}" data-pd="${k}"><b>${d}</b><i>${p.mark||''}</i>${p.note?'<u></u>':''}${k===planTarget?'<em>📌</em>':''}</button>`;
  }
  $('planCal').innerHTML=h;$('planMonth').textContent=`${MTH[m]} ${y+543}`;
}
function renderEditor(){
  const p=plans[pSel]||{},isT=planTarget===pSel;
  $('pDate').textContent=parseKey(pSel).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('pCd').textContent='· '+cdText(pSel);
  $('pMarks').innerHTML=MARKS.map(m=>`<button class="mk ${p.mark===m?'on':''}" data-mk="${m}">${m}</button>`).join('');
  $('pNote').value=p.note||'';
  $('pTgt').textContent=isT?'📌 ยกเลิกวันเป้าหมาย':'📌 ตั้งเป็นวันเป้าหมาย (นับถอยหลัง)';
  $('pTime').style.display=isT?'':'none';$('pTime').value=p.time||'00:00:00';
}
function openPlan(){pv=new Date();pv.setDate(1);pSel=keyOf(new Date());renderPlan();renderEditor();openModal('planOv');tick()}
$('pPrev').onclick=()=>{pv=new Date(pv.getFullYear(),pv.getMonth()-1,1);renderPlan()};
$('pNext').onclick=()=>{pv=new Date(pv.getFullYear(),pv.getMonth()+1,1);renderPlan()};
$('pToday').onclick=()=>{pv=new Date();pv.setDate(1);pSel=keyOf(new Date());renderPlan();renderEditor()};
$('planCal').onclick=e=>{const b=e.target.closest('[data-pd]');if(!b)return;pSel=b.dataset.pd;renderPlan();renderEditor()};
$('pMarks').onclick=e=>{const b=e.target.closest('[data-mk]');if(!b)return;const p=ent(pSel);p.mark=p.mark===b.dataset.mk?'':b.dataset.mk;commit();renderPlan();renderEditor()};
$('pNote').oninput=e=>{ent(pSel).note=e.target.value;commit();renderPlan();tick()};
$('pTgt').onclick=()=>{planTarget=planTarget===pSel?null:pSel;if(planTarget){const n=new Date(),p2=x=>String(x).padStart(2,'0');ent(pSel).time=dayDiff(pSel)>0?`${p2(n.getHours())}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`:'23:59:59'}commit();renderPlan();renderEditor();tick()};
$('pTime').onchange=e=>{ent(pSel).time=e.target.value||'00:00:00';commit();tick()};
$('pClear').onclick=async()=>{if(await ask('ล้างมาร์กและข้อความของวันนี้ใช่ไหม?')){delete plans[pSel];if(planTarget===pSel)planTarget=null;commit();renderPlan();renderEditor();tick()}};
// นับเวลาถอยหลังไปยังวันเป้าหมาย (แสดงใต้ Hero และในปฏิทิน)
function tick(){
  const el=$('heroCd'),box=$('planTargetBox');
  if(!planTarget){el.style.display='none';box.style.display='none';return}
  const p=plans[planTarget]||{},[hh,mm,ss]=(p.time||'00:00:00').split(':').map(Number),t=parseKey(planTarget);t.setHours(hh||0,mm||0,ss||0,0);
  const diff=t-Date.now(),label=(p.note||'').split('\n')[0].slice(0,24)||'วันเป้าหมาย';let txt;
  if(diff>0){const s=Math.ceil(diff/1000),z=x=>String(x).padStart(2,'0');const dd=s>86400?Math.floor(s/86400):0,hh2=dd?Math.floor(s%86400/3600):Math.floor(s/3600);txt=`⏳ ${label} · อีก ${dd?dd+' วัน ':''}${hh2} ชม. ${z(Math.floor(s%3600/60))} นาที ${z(s%60)} วิ`}
  else if(dayDiff(planTarget)===0)txt=`🎉 ถึงวัน "${label}" แล้ว!`;
  else txt=`✅ "${label}" ผ่านมาแล้ว ${-dayDiff(planTarget)} วัน`;
  [el,box].forEach(x=>{x.textContent=txt;x.style.display='block'});
}
$('heroCd').onclick=openPlan;setInterval(tick,1000);tick();
</script>
